<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BryAi</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      width: 100vw;
      height: 100dvh;
      background-image: url("0193C3B9-9B64-44D3-9C19-D70B80BED6D0.png");
      background-size: 100% auto;
      background-position: center bottom;
      background-repeat: no-repeat;
      position: relative;
    }

    #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* Invisible tap area over the Replace & Erase words built into the PNG.
       Adjust these four values only if the hit area needs tuning. */
    #replaceEraseTap {
      position: absolute;
      left: 18%;
      top: 20%;
      width: 64%;
      height: 28%;
      z-index: 2;
      cursor: pointer;
      background: transparent;
      border: 0;
      padding: 0;
    }

    #plaque {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, .72);
    }

    #plaque.open {
      display: flex;
    }

    #plaqueText {
      width: min(520px, 88vw);
      padding: 28px;
      box-sizing: border-box;
      background: #111;
      color: #fff;
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    #plaqueText p {
      margin: 0 0 20px;
    }

    #plaqueText p:last-child {
      margin-bottom: 0;
    }
  </style>
</head>

<body>

  <img
    id="overlay"
    src="2E5D1439-E9F1-4D73-A2F7-5C78DEB2036C.png"
    alt=""
  >

  <button id="replaceEraseTap" aria-label="Open Replace & Erase"></button>

  <div id="plaque">
    <div id="plaqueText">
      <p>Replace &amp; Erase is an example of BryAi finding a way to do something complex.</p>

      <p>At least for BryAi it felt complex. He then found a way to make it easier for himself.</p>

      <p>Replace &amp; Erase is a sample of BryAi taking the long run into consideration.</p>
    </div>
  </div>

  <script>
    const tap = document.getElementById("replaceEraseTap");
    const plaque = document.getElementById("plaque");

    tap.addEventListener("click", (event) => {
      event.stopPropagation();
      plaque.classList.add("open");
    });

    plaque.addEventListener("click", () => {
      plaque.classList.remove("open");
    });
  </script>

</body>
</html>
