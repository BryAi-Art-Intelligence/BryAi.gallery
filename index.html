<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BryAi</title>

<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    width: 100vw;
    height: 100dvh;

    background-image: url("0193C3B9-9B64-44D3-9C19-D70B80BED6D0.png");
    background-size: 100% auto;
    background-position: center bottom;
    background-repeat: no-repeat;

    position: relative;
    cursor: pointer;
    touch-action: pan-y;
  }


  /* =========================
     ORIGINAL LIGHT OVERLAY
     ========================= */

  #overlay {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    pointer-events: none;

    opacity: 1;

    z-index: 2;
  }

  #overlay.off {
    opacity: 0;
  }


  /* =========================
     OUTSIDE
     ========================= */

  #outside {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    pointer-events: none;

    opacity: 0;

    transition: opacity 1.2s ease;

    z-index: 10;
  }

  #outside.show {
    opacity: 1;
  }


  /* =========================
     LIGHT PIECE ON OUTSIDE
     ========================= */

  #outsideLight {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    pointer-events: none;

    opacity: 0;

    transition: opacity 0.8s ease;

    z-index: 20;
  }

  #outsideLight.show {
    opacity: 1;
  }

</style>
</head>


<body>


  <!-- ORIGINAL LIGHT PIECE -->
  <img
    id="overlay"
    src="2E5D1439-E9F1-4D73-A2F7-5C78DEB2036C.png"
    alt=""
  >


  <!-- OUTSIDE BOKEH -->
  <img
    id="outside"
    src="ABDDFA3C-1114-4285-84C8-B11000BFE007.png"
    alt=""
  >


  <!-- SAME LIGHT PIECE,
       NOW ALSO AVAILABLE OUTSIDE -->
  <img
    id="outsideLight"
    src="2E5D1439-E9F1-4D73-A2F7-5C78DEB2036C.png"
    alt=""
  >


<script>

  const overlay =
    document.getElementById("overlay");

  const outside =
    document.getElementById("outside");

  const outsideLight =
    document.getElementById("outsideLight");


  let startX = 0;
  let startY = 0;
  let moved = false;


  /* =========================
     TAP
     ========================= */

  document.body.addEventListener("click", () => {

    /*
      Prevent the swipe from
      accidentally becoming a tap.
    */

    if (moved) {
      moved = false;
      return;
    }


    /*
      IF WE ARE OUTSIDE:

      Tap controls the light artwork
      ABOVE the bokeh image.
    */

    if (outside.classList.contains("show")) {

      outsideLight.classList.toggle("show");

      return;
    }


    /*
      IF WE ARE INSIDE:

      Preserve the original
      tap behavior.
    */

    overlay.classList.toggle("off");

  });



  /* =========================
     SWIPE START
     ========================= */

  document.body.addEventListener(
    "touchstart",
    (e) => {

      startX =
        e.touches[0].clientX;

      startY =
        e.touches[0].clientY;

      moved = false;

    },
    { passive: true }
  );



  /* =========================
     SWIPE END
     ========================= */

  document.body.addEventListener(
    "touchend",
    (e) => {

      const endX =
        e.changedTouches[0].clientX;

      const endY =
        e.changedTouches[0].clientY;


      const deltaX =
        endX - startX;

      const deltaY =
        endY - startY;


      /*
        Ignore tiny movements.
      */

      if (Math.abs(deltaX) < 50) {
        return;
      }


      /*
        Only accept mostly
        horizontal movement.
      */

      if (
        Math.abs(deltaX) <=
        Math.abs(deltaY)
      ) {
        return;
      }


      moved = true;


      /* =====================
         SWIPE RIGHT
         GO OUTSIDE
         ===================== */

      if (deltaX > 0) {

        outside.classList.add("show");

      }


      /* =====================
         SWIPE LEFT
         GO BACK INSIDE
         ===================== */

      if (deltaX < 0) {

        outside.classList.remove("show");

        /*
          Reset the outside artwork
          so next visit begins clean.
        */

        outsideLight.classList.remove("show");

      }

    },
    { passive: true }
  );

</script>

</body>
</html>
