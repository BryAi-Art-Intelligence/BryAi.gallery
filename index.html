<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BryAi</title>

<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    width: 100vw;
    height: 100dvh;

    background-image: url("0193C3B9-9B64-44D3-9C19-D70B80BED6D0.png");
    background-size: 100% auto;
    background-position: center bottom;
    background-repeat: no-repeat;

    position: relative;
    cursor: pointer;
  }

  #overlay {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    pointer-events: none;

    opacity: 1;
  }

  #overlay.off {
    opacity: 0;
  }
</style>
</head>

<body>

  <img
    id="overlay"
    src="2E5D1439-E9F1-4D73-A2F7-5C78DEB2036C.png"
    alt=""
  >

<script>
  const overlay = document.getElementById("overlay");

  document.body.addEventListener("click", () => {
    overlay.classList.toggle("off");
  });
</script>

</body>
</html>
